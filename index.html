<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading…</title>
  <link rel="stylesheet" href="style.css">
  <noscript><meta http-equiv="refresh" content="3;url=https://agar.io/"></noscript>
</head>
<body>
  <div class="wrap">
    <div class="cells">
      <div class="cell c1"></div>
      <div class="cell c2"></div>
      <div class="cell c3"></div>
    </div>
    <h1>Loading…</h1>
    <div class="track"><div class="bar"></div></div>
    <p>Not redirected? <a href="https://agar.io/">Click here</a></p>
  </div>

  <script>
    // Redirect after 3 seconds (3000 ms)
    setTimeout(function () {
      window.location.replace("https://agar.io/");
    }, 3000);
  </script>
</body>
</html>
