<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#031039">
<title>777 AGAR — Loading</title>
<style>
  :root {
    --navy: #020a26;
    --blue: #087cff;
    --cyan: #13dfff;
    --gold: #ffc94a;
    --white: #f4f8ff;
    --muted: #a8c8ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    color: var(--white);
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(0, 107, 255, .28), transparent 40%),
      radial-gradient(ellipse at 0% 80%, rgba(0, 217, 255, .13), transparent 35%),
      linear-gradient(145deg, #06194c 0%, var(--navy) 55%, #020720 100%);
    display: flex;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    width: 75vw;
    height: 75vw;
    max-width: 720px;
    max-height: 720px;
    border: 2px solid rgba(0, 130, 255, .5);
    border-radius: 50%;
    pointer-events: none;
    filter: drop-shadow(0 0 12px rgba(0, 153, 255, .5));
  }
  body::before { top: -54vw; left: -32vw; }
  body::after { bottom: -59vw; right: -33vw; }
  .screen {
    width: min(100%, 520px);
    min-height: 100vh;
    min-height: 100svh;
    padding: 18px 22px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }
  .status {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 14px;
    letter-spacing: .2px;
    color: #eef5ff;
  }
  .status-icons { display: flex; gap: 8px; align-items: center; }
  .signal { width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 15px solid #f4f8ff; transform: rotate(180deg); }
  .battery { width: 19px; height: 11px; border: 1.5px solid white; border-radius: 2px; position: relative; }
  .battery::before { content:""; position:absolute; right:-4px; top:2px; width:2px; height:5px; background:white; }
  .battery::after { content:""; position:absolute; inset:2px; background:white; }
  .brand {
    text-align: center;
    margin: clamp(42px, 8vh, 76px) 0 0;
    width: 100%;
  }
  .crown {
    font-size: clamp(46px, 11vw, 70px);
    line-height: .9;
    filter: drop-shadow(0 0 12px rgba(255, 197, 55, .55));
    margin-bottom: -2px;
  }
  .logo {
    display: inline-block;
    font-weight: 1000;
    font-style: italic;
    font-size: clamp(58px, 15vw, 92px);
    line-height: .95;
    letter-spacing: -5px;
    color: #dffaff;
    background: linear-gradient(180deg, #fff 0%, #a7f4ff 24%, #13a9ff 55%, #0752dc 82%, #e9faff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,.55);
    filter: drop-shadow(0 4px 0 #062d8d) drop-shadow(0 0 15px rgba(0, 190, 255, .7));
  }
  .brand-name {
    display: block;
    font-size: clamp(35px, 9vw, 54px);
    font-weight: 1000;
    font-style: italic;
    letter-spacing: 1px;
    color: #fff;
    text-shadow: 0 3px 0 #1253ba, 0 0 15px rgba(0, 195, 255, .7);
    margin-top: 1px;
  }
  .tagline {
    margin: 17px 0 0;
    letter-spacing: 4px;
    font-size: 13px;
    font-weight: 700;
    color: #d2e3ff;
  }
  .loader-area {
    margin: auto 0;
    padding: 38px 0 50px;
    text-align: center;
  }
  .loader {
    width: 62px;
    height: 62px;
    border: 8px solid rgba(0, 129, 255, .22);
    border-top-color: var(--cyan);
    border-right-color: var(--blue);
    border-radius: 50%;
    margin: 0 auto 20px;
    animation: spin 1s linear infinite;
    box-shadow: 0 0 20px rgba(0, 151, 255, .2);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 17px; color: #e3eeff; margin: 0; }
  .notice {
    width: 100%;
    border: 1px solid rgba(0, 133, 255, .8);
    border-radius: 20px;
    background: rgba(3, 28, 78, .7);
    box-shadow: inset 0 0 25px rgba(0, 108, 255, .07);
    padding: 20px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 18px;
  }
  .globe { width: 48px; height: 48px; flex: 0 0 48px; color: var(--cyan); }
  .notice-title { margin: 0 0 5px; font-size: 16px; font-weight: 750; overflow-wrap: anywhere; }
  .notice-copy { margin: 0; font-size: 13px; line-height: 1.45; color: #8db7ff; }
  .continue {
    width: 100%;
    display: block;
    border: 0;
    border-radius: 30px;
    padding: 18px 14px;
    text-align: center;
    text-decoration: none;
    color: #fff;
    font-size: 17px;
    font-weight: 800;
    background: linear-gradient(100deg, #0bc8ff, #0872ff 65%, #0649ff);
    box-shadow: 0 8px 25px rgba(0, 100, 255, .25);
    transition: transform .15s ease, filter .15s ease;
  }
  .continue:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .continue:focus-visible, .cancel:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  .cancel {
    display: inline-block;
    margin: 18px auto 0;
    padding: 5px 16px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 650;
    font-size: 16px;
  }
  .footer {
    display: flex;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-top: 25px;
    font-size: 13px;
    color: #c3d9ff;
  }
  .age {
    width: 38px; height: 38px; border: 2px solid #a7c8ff;
    border-radius: 50%; display: grid; place-items: center; font-weight: 800;
  }
  .separator { color: #4f91ff; }
  @media (max-height: 760px) {
    .brand { margin-top: 28px; }
    .loader-area { padding: 20px 0 26px; }
    .crown { font-size: 48px; }
    .logo { font-size: 62px; }
    .brand-name { font-size: 38px; }
    .tagline { margin-top: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .loader { animation-duration: 3s; }
    .continue { transition: none; }
  }
</style>
</head>
<body>
  <main class="screen">
    <div class="status" aria-label="Phone status bar">
      <span>12:30</span>
      <div class="status-icons" aria-hidden="true">
        <span class="signal"></span><span>▰</span><span class="battery"></span><span>100%</span>
      </div>
    </div>

    <header class="brand" aria-label="777 AGAR">
      <div class="crown" aria-hidden="true">👑</div>
      <div class="logo">777</div>
      <span class="brand-name">AGAR</span>
      <p class="tagline">PLAY <span style="color:#13dfff">•</span> ENJOY <span style="color:#13dfff">•</span> WIN</p>
    </header>

    <section class="loader-area" aria-live="polite" aria-label="Loading">
      <div class="loader" role="progressbar" aria-label="Preparing your experience"></div>
      <p class="loading-text">Preparing your experience...</p>
    </section>

    <section class="notice" aria-label="External website notice">
      <svg class="globe" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
        <circle cx="24" cy="24" r="19"></circle>
        <ellipse cx="24" cy="24" rx="8" ry="19"></ellipse>
        <path d="M6 17h36M6 31h36M5 24h38"></path>
      </svg>
      <div>
        <p class="notice-title">External website: <strong>17ph33.win</strong></p>
        <p class="notice-copy">Review the destination before continuing.</p>
      </div>
    </section>

    <a class="continue" href="https://www.17ph33.win/?pid=896950662&amp;fromPage=AGENCY_CENTER"
       target="_blank" rel="noopener noreferrer">
      ↗ &nbsp; Continue to website
    </a>
    <a class="cancel" href="#" id="cancelLink">Cancel</a>

    <footer class="footer">
      <span class="age">18+</span>
      <span class="separator">|</span>
      <span>Play responsibly</span>
    </footer>
  </main>
<script>
  // Cancel does not redirect anywhere; it stops the loading animation and updates the message.
  document.getElementById("cancelLink").addEventListener("click", function (event) {
    event.preventDefault();
    const loader = document.querySelector(".loader");
    const message = document.querySelector(".loading-text");
    loader.style.animation = "none";
    loader.style.borderColor = "rgba(141,183,255,.45)";
    message.textContent = "You cancelled. You can safely close this page.";
  });
</script>
</body>
</html>
